[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecomarket-agent"
version = "0.1.0"
description = "Agente Plan-and-Execute para devoluciones de EcoMarket"
readme = "README_PROYECTO_FINAL.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4,<2",
    "langgraph>=1.0,<2",
    "langsmith>=0.4,<1",
    "langchain-google-genai>=4.4,<5",
    "langchain-huggingface>=1.2,<2",
    "langchain-milvus>=0.4,<1",
    "langchain-text-splitters>=1.1,<2",
    "milvus-lite>=3.2,<4",
    "pydantic>=2.12,<3",
    "pypdf>=6.19,<7",
    "python-dotenv>=1.2,<2",
    "sentence-transformers>=6.1,<7",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
